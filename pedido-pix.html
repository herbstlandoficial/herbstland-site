<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f8f6"><title>Pagamento Pix — HERBSTLAND</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="herbstland-v11.css?v=126"><style>
.pix-page{min-height:80vh;background:#fff;padding:28px 16px 64px;color:#20231f;font-family:Manrope,Arial,sans-serif}.pix-wrap{max-width:645px;margin:auto}.pix-thanks,.pix-card,.pix-details,.pix-address{border:1px solid #e0e5e1;border-radius:12px;background:#fff;margin-bottom:18px;box-shadow:0 1px 2px #00000008}.pix-thanks{background:#f6faf7;text-align:center;padding:22px 18px 26px}.pix-thanks h1{font-size:21px;margin:0 0 7px;font-weight:800}.pix-thanks p{font-size:12px;color:#5d665f;line-height:1.6;margin:0 auto 17px;max-width:390px}.pix-whats{display:inline-flex;align-items:center;gap:8px;background:#20c968;color:#fff;text-decoration:none;border-radius:4px;padding:12px 20px;font-size:13px;font-weight:800}.pix-meta{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:18px 0}.pix-meta div{border:1px solid #e1e4e1;border-radius:9px;padding:10px 11px;min-width:0}.pix-meta small{display:block;color:#747c77;font-size:8px;text-transform:uppercase;margin-bottom:5px}.pix-meta strong{display:block;font-size:10px;overflow-wrap:anywhere}.pix-instruction{font-size:14px;margin:18px 0 10px}.pix-card{display:grid;grid-template-columns:1fr 1.15fr;padding:18px;gap:18px}.pix-how{border-right:1px solid #e0e5e1;padding:20px 15px 20px 8px}.pix-logo{display:flex;align-items:center;gap:8px;color:#21b7a8;font-size:34px;font-weight:400;letter-spacing:-2px;margin-bottom:26px}.pix-logo span{font-size:12px;color:#7a817d;letter-spacing:0}.pix-how h3{font-size:13px;color:#666;margin:0 0 16px}.pix-how ol{padding:0;margin:0;list-style:none}.pix-how li{display:flex;gap:10px;align-items:flex-start;font-size:11px;margin:0 0 12px;line-height:1.4}.pix-how li b{display:grid;place-items:center;flex:0 0 19px;height:19px;border:1px solid #3285ff;color:#3285ff;border-radius:50%;font-size:11px}.pix-code{text-align:center;padding:20px 3px 12px}.pix-amount{font-size:13px;margin:0 0 24px}.pix-amount strong{font-weight:800}.pix-code h3{font-size:12px;margin:0 0 16px}.pix-qr{width:142px;height:142px;object-fit:contain;display:block;margin:0 auto 10px}.pix-expiry{font-size:10px;color:#7a817d;margin-bottom:28px}.pix-copy-label{font-size:11px;line-height:1.5;margin:0 auto 12px;max-width:280px}.pix-copy-row{display:flex;gap:8px;align-items:stretch}.pix-copy-row input{min-width:0;flex:1;border:1px solid #cfd5d1;border-radius:5px;padding:10px;font:10px Manrope;overflow:hidden;text-overflow:ellipsis}.pix-copy-row button{border:0;border-radius:5px;background:#3285ff;color:#fff;font-size:10px;font-weight:800;padding:0 12px;cursor:pointer}.pix-copy-status{height:16px;color:#168b55;font-size:10px;margin:6px 0 0}.pix-details,.pix-address{padding:17px 18px}.pix-details h2,.pix-address h2{font-size:13px;margin:0 0 11px}.pix-table{width:100%;border-collapse:collapse;font-size:10px}.pix-table th{text-align:left;background:#f6f7f6;color:#737b75;font-size:8px;padding:10px}.pix-table td{padding:10px;border-bottom:1px solid #eceeec;vertical-align:top}.pix-table td:last-child,.pix-table th:last-child{text-align:right}.pix-table .sum td{font-weight:700}.pix-table .total td{font-size:12px;font-weight:800;border:0}.pix-address p{font-size:11px;line-height:1.8;margin:0;color:#4e5650}.pix-error{padding:30px;text-align:center}.pix-error a{color:#8b6b08}@media(max-width:540px){.pix-page{padding:18px 12px 45px}.pix-thanks h1{font-size:18px}.pix-meta{grid-template-columns:repeat(2,1fr)}.pix-card{grid-template-columns:1fr;padding:14px;gap:0}.pix-how{border-right:0;border-bottom:1px solid #e0e5e1;padding:10px 8px 16px}.pix-logo{margin-bottom:17px}.pix-code{padding:20px 3px 10px}.pix-copy-row button{padding:0 10px}.pix-details,.pix-address{padding:15px 13px}}
</style></head><body><header class="site-header header-v2"><div class="header-main-row"><a class="wordmark" href="index.html"><img src="assets/herbstland-logo.png" alt="HERBSTLAND"></a></div></header><main class="pix-page"><div class="pix-wrap" id="pix-content"><div class="pix-error">Carregando os dados do seu pedido…</div></div></main><footer class="footer footer-expanded"><div class="footer-bottom"><span>© 2026 HERBSTLAND. TODOS OS DIREITOS RESERVADOS.</span><span>NÃO NASCEMOS PARA SER IGUAIS.</span></div></footer><script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}), order=(()=>{try{return JSON.parse(sessionStorage.getItem('herbstland-pix-order')||'null')}catch{return null}})();
if(!order||!order.qrCode||!order.qrCodeBase64){$('#pix-content').innerHTML='<div class="pix-card pix-error"><h2>Não encontramos os dados deste pagamento.</h2><p>Se você já gerou um Pix, volte à etapa de pagamento ou fale com nosso atendimento.</p><a href="checkout.html">Voltar ao checkout</a></div>';}else{
const c=order.customer||{},items=order.items||[],fmtDate=new Date(order.expiration);const exp=Number.isNaN(fmtDate.getTime())?'30 minutos':fmtDate.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
const wa=`https://wa.me/5511941466298?text=${encodeURIComponent('Olá! Gereis um Pix para meu pedido HERBSTLAND. Número: '+order.orderNumber+'. Gostaria de enviar os detalhes do pedido.')}`;
$('#pix-content').innerHTML=`<section class="pix-thanks"><h1>Obrigado por comprar conosco, ${esc((c.name||'').split(' ')[0]||'') }!</h1><p>Para uma resposta mais rápida, envie os detalhes do seu pedido clicando no botão verde abaixo.</p><a class="pix-whats" href="${wa}" target="_blank" rel="noopener">☏ Enviar Detalhes do Pedido</a></section><section class="pix-meta"><div><small>Número do pedido</small><strong>${esc(order.orderNumber)}</strong></div><div><small>Data</small><strong>${new Date().toLocaleDateString('pt-BR')}</strong></div><div><small>Total</small><strong>${money(order.amount)}</strong></div><div><small>Método de pagamento</small><strong>Pix (5% de desconto)</strong></div></section><h2 class="pix-instruction">Agora é só pagar com o Pix para finalizar sua compra</h2><section class="pix-card"><div class="pix-how"><div class="pix-logo">◆<span>pix<br><small>powered by Banco Central</small></span></div><h3>Como pagar com Pix:</h3><ol><li><b>1</b><span>Acesse o app ou site do seu banco</span></li><li><b>2</b><span>Busque a opção de pagar com Pix</span></li><li><b>3</b><span>Leia o QR Code ou código Pix</span></li><li><b>4</b><span>Pronto! Você verá a confirmação do pagamento</span></li></ol></div><div class="pix-code"><p class="pix-amount">Valor a pagar: <strong>${money(order.amount)}</strong></p><h3>Escaneie o QR code:</h3><img class="pix-qr" src="data:image/png;base64,${order.qrCodeBase64}" alt="QR Code Pix para pagamento"><div class="pix-expiry">Código válido até ${exp}</div><p class="pix-copy-label">Se preferir, você pode pagar copiando e colando o seguinte código</p><div class="pix-copy-row"><input id="pix-copy" readonly value="${esc(order.qrCode)}" aria-label="Código Pix copia e cola"><button id="copy-button" type="button">Copiar código</button></div><p class="pix-copy-status" id="copy-status" aria-live="polite"></p></div></section><section class="pix-details"><h2>Detalhes do pedido</h2><table class="pix-table"><thead><tr><th>PRODUTO</th><th>TOTAL</th></tr></thead><tbody>${items.map(p=>`<tr><td>${esc(p.name)}<br>${esc([p.color,p.size?'Tamanho '+p.size:''].filter(Boolean).join(' • '))} × ${Number(p.quantity)||1}</td><td>${money((Number(p.price)||0)*(Number(p.quantity)||1))}</td></tr>`).join('')}<tr class="sum"><td>Subtotal:</td><td>${money(order.subtotal)}</td></tr><tr><td>Entrega:</td><td>${esc(order.delivery||'A confirmar')}</td></tr><tr><td>Desconto Pix (5%):</td><td>−${money(order.discount)}</td></tr><tr><td>Método de pagamento:</td><td>Pix (5% de desconto)</td></tr><tr class="total"><td>Total:</td><td>${money(order.amount)}</td></tr></tbody></table></section><section class="pix-address"><h2>Endereço de cobrança</h2><p>${esc(c.name)}<br>${esc(c.address)}<br>${c.complement?esc(c.complement)+'<br>':''}${esc(c.cep)}<br>${esc(c.city)} / ${esc(c.state)}<br>Telefone: ${esc(c.phone)}<br>E-mail: ${esc(c.email)}</p></section>`;
$('#copy-button').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(order.qrCode);$('#copy-status').textContent='Código Pix copiado!'}catch{$('#pix-copy').select();document.execCommand('copy');$('#copy-status').textContent='Código Pix copiado!'}});
}
</script></body></html>
